name: Docs QA

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'reference/**'
      - 'std/**'
      - 'compare/**'
      - 'raw/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/docs-qa.yml'
  push:
    branches: [main]
    paths:
      - 'reference/**'
      - 'std/**'
      - 'compare/**'
      - 'raw/**'
      - 'scripts/**'
      - 'site/**'
      - '.github/workflows/docs-qa.yml'

jobs:
  check-code-examples:
    name: Verify Code Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zen C Compiler
        run: |
          git clone --depth 1 https://github.com/zenc-lang/zenc.git /tmp/zenc-build
          cd /tmp/zenc-build
          sudo apt-get update && sudo apt-get install -y libtcc-dev
          make -j$(nproc)
          sudo make install
          cd -

      - name: Run Code Example Checker
        run: |
          # Validate the runnable examples in the reference chapters. The std/
          # docs are hand-written today and will be generated from /// doc
          # comments by `zc-doc`; they are re-enabled once generated.
          python3 scripts/check_doc_examples.py reference/*.md

  check-translations:
    name: Translation Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Translation Gaps
        run: |
          python3 scripts/check_translations.py reference std

  check-comparisons:
    name: Verify C Comparisons
    runs-on: ubuntu-latest
    if: ${{ hashFiles('compare/**') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Zen C Compiler
        run: |
          git clone --depth 1 https://github.com/zenc-lang/zenc.git /tmp/zenc-build
          cd /tmp/zenc-build
          sudo apt-get update && sudo apt-get install -y libtcc-dev
          make -j$(nproc)
          sudo make install
          cd -

      - name: Install Python dependencies
        run: pip install unidecode

      - name: Run Comparison Checker
        run: |
          python3 compare/scripts/check_comparisons.py
